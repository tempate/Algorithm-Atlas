<a class="a-unstyled" href="../index.html">
    <h2>Hash functions</h2>
</a>

<div style="height: 50px;"></div>

<form onsubmit="return false;">
    <div class="form-group">
        <textarea id="msg" name="msg" class="form-control" rows="8" cols="80" placeholder="Message to hash"></textarea>
    </div>
    <div class="form-group row justify-content-center">
        <div class="col-sm-3">
            <select id="alg" class="form-control text-center" name="alg">
                <option class="text-center" value="sha1">SHA-1</option>
            </select>
        </div>
        <div class="col-sm-3">
            <button id="run" type="button" class="btn btn-outline-primary" disabled>Starting...</button>
        </div>
    </div>
    <div class="row justify-content-center">
        <p id="error" class="red margin-top"></p>
    </div>
</form>


                </div>
            </div>
        </div>

         
    <script src="../vendor/brython/brython.js"></script>
    <script src="../vendor/brython/brython_stdlib.js"></script>

    <!-- pythonpath is read off this tag, not from the brython() call -->
    <script type="text/python" pythonpath="../assets/python">
from browser import document

from cryptography import sha1

HASHES = {"sha1": sha1}


def run(event):
    """ Replaces the message with its digest, as the server used to. """
    msg = document["msg"].value

    if not msg:
        document["error"].text = "Type a message to hash."
        return

    document["error"].text = ""
    document["msg"].value = HASHES[document["alg"].value].hash_sum(msg)


document["run"].bind("click", run)
document["run"].text = "Hash"
del document["run"].attrs["disabled"]
    </script>
