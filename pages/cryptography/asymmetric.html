<script type="text/javascript">
    // Which of the two the chatbox is showing. Python redraws the messages and
    // then calls update() again so the choice survives. It hangs off window
    // because a top-level let is not reachable from Brython.
    window.currentAction = 0;

    function update(action) {
        window.currentAction = action;

        let cipher = document.querySelectorAll("*[id^='cipher']");
        let plain = document.querySelectorAll("*[id^='plain']");

        for (let i = 0; i < cipher.length; i++) {
            cipher[i].style.display = action === 0 ? "inline" : "none";
            plain[i].style.display = action === 0 ? "none" : "inline";
        }

        document.getElementById("encrypt").className =
            action === 0 ? "btn btn-primary" : "btn btn-outline-primary";
        document.getElementById("decrypt").className =
            action === 0 ? "btn btn-outline-primary" : "btn btn-primary";
    }
</script>

<script type="text/python" pythonpath="../../projects">
import json

from browser import document, html, window
from browser.local_storage import storage

from cryptography import rsa

USERS = ("alice", "bob")
MAX_MESSAGE = 500
STORAGE_KEY = "asymmetric-key"

state = {}


def load_state() -> dict:
    """
    Reads back the conversation from a previous visit.

    Anything unreadable is treated as absent, so a stale or hand-edited entry
    costs a fresh keyring rather than a broken page.
    """
    if STORAGE_KEY not in storage:
        return {}

    raw = storage[STORAGE_KEY]

    try:
        stored = json.loads(raw)
        loaded = {"history": stored["history"]}

        for name in USERS:
            # The keys are far larger than a JSON number survives, so they are
            # written as text and read back as ints.
            loaded[name] = {part: [int(n) for n in stored[name][part]]
                            for part in ("pk", "sk")}
    except Exception:
        # Deliberately broad: whatever is wrong with a stored entry, the right
        # answer is a fresh keyring rather than a page that will not start.
        return {}

    return loaded


def save_state():
    keys = {name: {part: [str(n) for n in state[name][part]]
                   for part in ("pk", "sk")}
            for name in USERS}
    keys["history"] = state["history"]

    try:
        storage[STORAGE_KEY] = json.dumps(keys)
    except Exception:
        # A full or disabled store should not stop the demo working; the
        # conversation just will not outlive the page.
        pass


def new_keys():
    """ Give Alice and Bob a fresh keyring and an empty conversation. """
    for name in USERS:
        keys = rsa.RSA()
        state[name] = {"pk": keys.public_key, "sk": keys.private_key}

    state["history"] = []
    save_state()


def show_keys():
    for name in USERS:
        document[name + "-pk"].value = state[name]["pk"][0]
        document[name + "-sk"].value = state[name]["sk"][0]


def show_history():
    """ Redraws the conversation, keeping whichever view is selected. """
    box = document["chatbox"]
    box.clear()

    for i, message in enumerate(state["history"], start=1):
        row = html.DIV(Class="justify-content-left row")
        row <= html.B(message["user"].title() + ": \xa0")
        row <= html.P(message["cipher"], id="cipher%d" % i)
        row <= html.P(message["plain"], id="plain%d" % i)
        box <= row

    window.update(window.currentAction)
    box.scrollTop = box.scrollHeight


def send(user):
    def handler(event):
        field = document[user + "-msg"]
        msg = field.value

        if not msg:
            document["error"].text = "Type a message."
            return

        if len(msg) > MAX_MESSAGE:
            document["error"].text = \
                "Messages are limited to %d characters." % MAX_MESSAGE
            return

        document["error"].text = ""
        to = "bob" if user == "alice" else "alice"

        # Signed with the sender's private key, then sealed with the
        # recipient's public one, and unwrapped in the same order.
        cipher_ = rsa.encrypt(msg, state[user]["sk"])
        cipher = rsa.encrypt(cipher_, state[to]["pk"])
        plain_ = rsa.decrypt(cipher, state[to]["sk"])
        plain = rsa.decrypt(plain_, state[user]["pk"])

        state["history"].append({"plain": plain, "cipher": cipher, "user": user})
        save_state()

        field.value = ""
        show_history()

    return handler


def regenerate(event):
    document["error"].text = ""
    new_keys()
    show_keys()
    show_history()


def start():
    state.update(load_state())

    if not all(name in state for name in USERS + ("history",)):
        new_keys()

    show_keys()
    show_history()

    for name in USERS:
        document[name + "-send"].bind("click", send(name))
        del document[name + "-send"].attrs["disabled"]

    document["regenerate"].bind("click", regenerate)
    del document["regenerate"].attrs["disabled"]


try:
    start()
except Exception as exc:
    # Better a visible reason than a page stuck on "generating...".
    document["error"].text = "Could not start: %s: %s" % (type(exc).__name__, exc)
</script>
